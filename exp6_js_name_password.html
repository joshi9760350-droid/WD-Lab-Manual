<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JS Validation - Name and Password</title>

body{font-family:Verdana,Arial,sans-serif;font-size:15px;color:#333;background:#FFF8F0;margin:0}

<body>
<table>
<tr class="header"><td width="15%"><img src="../assets/logo.svg" alt="logo" width="100" height="75"></td><td colspan="4">Online Book Store</td></tr>

<td colspan="4" align="center"><form onsubmit="return validateForm()"><h2>REGISTRATION PAGE</h2>
<p>Name: <input id="name" type="text"></p><p>Password: <input id="password" type="password"></p>
<p><button type="submit">Validate</button></p></form></td></tr><script>function validateForm(){
 const name=document.getElementById("name").value.trim();
 const password=document.getElementById("password").value;
 const namePattern=/^[A-Za-z]+$/;
 if(name.length<6){alert("Name should not be less than 6 characters.");return false;}
 if(!namePattern.test(name)){alert("Name should contain alphabets only.");return false;}
 if(password.length<6){alert("Password should not be less than 6 characters.");return false;}
 alert("Name and Password are valid!"); return false;
}</script>

</table>
