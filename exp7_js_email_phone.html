<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JS Validation - E-mail and Phone</title>
<style>
body{font-family:Verdana,Arial,sans-serif;font-size:15px;color:#333;background:#FFF8F0;margin:0}
table{border-collapse:collapse;width:100%;background:rgba(255,255,255,.85)}

.header{background:#FAC090;font-size:20px;font-weight:bold;text-align:center}
.menu{background:#FDE9D9;text-align:center}

a{text-decoration:none} a:hover{text-decoration:underline;color:#C0392B}

</style>
</head>
<body>
<table>
<tr class="header"><td width="15%"><img src="../assets/logo.svg" alt="logo" width="100" height="75"></td><td colspan="4">Online Book Store</td></tr>
<tr class="menu"><td><a href="exp1_home.html">Home</a></td><td><a href="exp2_login.html">Login</a></td><td><a href="exp5_registration.html">Registration</a></td><td><a href="exp3_catalogue.html">Catalogue</a></td><td><a href="exp4_cart.html">Cart</a></td></tr>

<tr><td class="sidemenu"><a href="#">CSE</a><br><a href="#">ECE</a><br><a href="#">EEE</a><br><a href="#">CIVIL</a></td>
<td colspan="4" align="center"><form onsubmit="return validateForm()"><h2>REGISTRATION PAGE</h2>
<p>E-mail id: <input id="email" type="text"></p><p>Phone Number: <input id="phone" type="text"></p>
<p><button type="submit">Validate</button></p></form></td></tr><script>function validateForm(){
 const email=document.getElementById("email").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const emailPattern=/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
 const phonePattern=/^[0-9]{10}$/;
 if(!emailPattern.test(email)){alert("Please enter a valid E-mail ID.");return false;}
 if(!phonePattern.test(phone)){alert("Phone number should contain exactly 10 digits.");return false;}
 alert("E-mail and Phone Number are valid!");return false;
}</script>

</table>
</body></html>
