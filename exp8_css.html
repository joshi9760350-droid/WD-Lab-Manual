<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Experiment 8 - CSS</title>
<style>
body{font-family:Verdana,Arial,sans-serif;font-size:15px;color:#333;background:#FFF8F0 url("../assets/library.svg") repeat;}
table{border-collapse:collapse;width:100%;background:rgba(255,255,255,.75)}td{border:1px solid #444;padding:8px}
h1{font-family:Georgia,serif;font-size:30px;color:#C0392B;text-align:center}

.menu{background:#FDE9D9;text-align:center}.description{height:220px;background:url("../assets/description.svg") center/cover no-repeat}
.note{font-style:italic;font-weight:bold;color:#117A65}.highlight{background:#FFFF99;text-decoration:underline}

<tr><td>Departments<br><br>CSE<br><br>ECE<br><br>EEE<br><br>CIVIL</td><td colspan="4" class="description"><h2>CSS Styling Demo</h2><p class="note">Different fonts, colors and background images.</p><p class="highlight">Highlighted text</p></td></tr></table>
</body></html>
