<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Experiment 9 - Background Repeat and Links</title>
<style>
body{font-family:Verdana,Arial,sans-serif;color:#333;background:#FFF8F0 url("../assets/library.svg") repeat}
table{border-collapse:collapse;width:100%;background:rgba(255,255,255,.7)}td{border:1px solid #444;padding:8px}
.header{background:#FAC090;font-size:20px;font-weight:bold;text-align:center}.menu{background:#FDE9D9;text-align:center}
.box{width:280px;height:140px;border:2px solid #C0392B;margin:10px;display:inline-block;vertical-align:top;text-align:center;background-image:url("../assets/logo.svg");background-color:#fff;font-weight:bold}
.rep{background-repeat:repeat}.rep-x{background-repeat:repeat-x}.rep-y{background-repeat:repeat-y}.no-rep{background-repeat:no-repeat}
a:link{color:#00f;text-decoration:none}a:visited{color:#800080;text-decoration:none}a:hover{color:#f00;text-decoration:underline;background:#ffff99}a:active{color:#008000;font-weight:bold}
</style></head><body>
<table><tr class="header"><td width="15%"><img src="../assets/logo.svg" width="100" alt="logo"></td><td colspan="4">Online Book Store</td></tr>
<tr class="menu"><td><a href="#">Home</a></td><td><a href="#">Login</a></td><td><a href="#">Registration</a></td><td><a href="#">Catalogue</a></td><td><a href="#">Cart</a></td></tr>
<tr><td valign="top"><a href="#">CSE</a><br><a href="#">ECE</a><br><a href="#">EEE</a><br><a href="#">CIVIL</a></td>
<td colspan="4"><h2>1) background-repeat property</h2>
<div class="box rep">repeat</div><div class="box rep-x">repeat-x</div><div class="box rep-y">repeat-y</div><div class="box no-rep">no-repeat</div>
<h2>2) Link styles</h2><ul><li><a href="#">a:link</a></li><li><a href="https://example.com">a:visited</a></li><li><a href="#">a:hover</a></li><li><a href="#">a:active</a></li></ul>
</td></tr></table></body></html>
